<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zakazivanje termina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#14232b;--muted:#5d6e77;--line:#d3dde2;--accent:#0f7b6c;--accent-ink:#fff;--off:#e4eaed;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a20;--card:#17262e;--ink:#e8f0f3;--muted:#9bb0ba;--line:#2a3d47;--accent:#3fc2ad;--accent-ink:#06211c;--off:#1d2f38;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.75rem;font-weight:800;margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px}
.day{flex:0 0 auto;min-width:64px;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;text-align:center;cursor:pointer}
.day b{display:block;font-size:1.15rem}
.day small{color:var(--muted)}
.day[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed=true] small{color:inherit}
h2{font-size:1rem;margin:0 0 10px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.slot{padding:10px 0;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;font:600 1rem/1 inherit;cursor:pointer}
.slot:hover{background:var(--accent);color:var(--accent-ink)}
.slot:disabled{border-color:var(--off);background:var(--off);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.empty{color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:20px;width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 1rem inherit;cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.msg{min-height:1.4em;margin-top:12px;font-weight:600}
.msg.err{color:var(--err)}
.msg.ok{color:var(--accent)}
.demo{margin-top:24px;font-size:.85rem;color:var(--muted)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="days" id="days" role="group" aria-label="Izaberi dan"></div>
  <h2 id="dayLabel"></h2>
  <div class="slots" id="slots"></div>
  <p class="msg" id="status" role="status"></p>
  <p class="demo" id="demo" hidden>Demo režim: termini se čuvaju samo u ovom pregledaču. Podesi Supabase u fajlu da bi ih videli svi.</p>
</main>

<dialog id="dlg">
  <h2 id="dlgTitle">Potvrdi termin</h2>
  <label for="name">Ime i prezime</label>
  <input id="name" autocomplete="name">
  <label for="email">Email</label>
  <input id="email" type="email" autocomplete="email">
  <p class="msg" id="dlgMsg" role="alert"></p>
  <div class="row">
    <button class="btn" id="cancel" type="button">Otkaži</button>
    <button class="btn main" id="confirm" type="button">Zakaži</button>
  </div>
</dialog>

<script>
/* ===== PODEŠAVANJA ===== */
const CONFIG = {
  title: "Zakaži termin",
  subtitle: "Izaberi dan i vreme koje ti odgovara.",
  daysAhead: 14,          // koliko dana unapred
  startHour: 9,           // prvi termin
  endHour: 17,            // kraj radnog vremena
  slotMinutes: 30,        // trajanje termina
  skipWeekends: true,
  // Supabase (opciono). Ostavi prazno za demo režim.
  supabaseUrl: "https://pxdyohegxvqhhawnbuju.supabase.co",        // npr. "https://abcd.supabase.co"
  supabaseKey: "sb_publishable_7iN6lWxS5srh_rRnoaahkg_tI5c2zaB"         // anon (public) ključ
};

/* Supabase SQL (SQL Editor):
create table bookings(slot text primary key, name text not null, email text not null, created_at timestamptz default now());
alter table bookings enable row level security;
create policy "anyone can book" on bookings for insert to anon with check (true);
create view taken_slots as select slot from bookings;
grant select on taken_slots to anon;
*/

const $ = id => document.getElementById(id);
const useDb = CONFIG.supabaseUrl && CONFIG.supabaseKey;
const hdr = {apikey: CONFIG.supabaseKey, Authorization: "Bearer " + CONFIG.supabaseKey, "Content-Type": "application/json"};
const pad = n => String(n).padStart(2, "0");
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let taken = new Set(), selectedDay = null, pendingSlot = null;

async function loadTaken() {
  try {
    if (useDb) {
      const r = await fetch(CONFIG.supabaseUrl + "/rest/v1/taken_slots?select=slot", {headers: hdr});
      if (!r.ok) throw new Error();
      taken = new Set((await r.json()).map(x => x.slot));
    } else {
      taken = new Set(JSON.parse(localStorage.getItem("bookings") || "[]").map(x => x.slot));
    }
  } catch (e) { setStatus("Ne mogu da učitam termine. Osveži stranicu.", true); }
}

async function saveBooking(slot, name, email) {
  if (useDb) {
    const r = await fetch(CONFIG.supabaseUrl + "/rest/v1/bookings", {method: "POST", headers: hdr, body: JSON.stringify({slot, name, email})});
    if (r.status === 409) return "taken";
    if (!r.ok) return "error";
  } else {
    try {
      const all = JSON.parse(localStorage.getItem("bookings") || "[]");
      if (all.some(x => x.slot === slot)) return "taken";
      all.push({slot, name, email});
      localStorage.setItem("bookings", JSON.stringify(all));
    } catch (e) { return "error"; }
  }
  return "ok";
}

function setStatus(t, err) { $("status").textContent = t; $("status").className = "msg " + (err ? "err" : "ok"); }

function buildDays() {
  const wrap = $("days"); wrap.innerHTML = "";
  const d = new Date(); d.setHours(0,0,0,0);
  let added = 0, i = 0;
  while (added < CONFIG.daysAhead && i < 60) {
    const day = new Date(d); day.setDate(d.getDate() + i++);
    const wd = day.getDay();
    if (CONFIG.skipWeekends && (wd === 0 || wd === 6)) continue;
    const b = document.createElement("button");
    b.className = "day"; b.dataset.key = dateKey(day);
    b.innerHTML = `<small>${day.toLocaleDateString("sr-Latn", {weekday: "short"})}</small><b>${day.getDate()}</b><small>${day.toLocaleDateString("sr-Latn", {month: "short"})}</small>`;
    b.onclick = () => selectDay(day);
    wrap.appendChild(b); added++;
    if (!selectedDay) selectedDay = day;
  }
  selectDay(selectedDay);
}

function selectDay(day) {
  selectedDay = day;
  document.querySelectorAll(".day").forEach(b => b.setAttribute("aria-pressed", b.dataset.key === dateKey(day)));
  $("dayLabel").textContent = day.toLocaleDateString("sr-Latn", {weekday: "long", day: "numeric", month: "long"});
  const box = $("slots"); box.innerHTML = "";
  const now = new Date(); let count = 0;
  for (let m = CONFIG.startHour * 60; m + CONFIG.slotMinutes <= CONFIG.endHour * 60; m += CONFIG.slotMinutes) {
    const t = `${pad(Math.floor(m/60))}:${pad(m%60)}`;
    const key = `${dateKey(day)}T${t}`;
    const when = new Date(`${key}:00`);
    const b = document.createElement("button");
    b.className = "slot"; b.textContent = t;
    b.disabled = taken.has(key) || when < now;
    b.onclick = () => openDialog(key, t);
    box.appendChild(b); count++;
  }
  if (!count) box.innerHTML = '<p class="empty">Nema slobodnih termina za ovaj dan.</p>';
}

function openDialog(key, t) {
  pendingSlot = key; $("dlgMsg").textContent = "";
  $("dlgTitle").textContent = `Termin: ${selectedDay.toLocaleDateString("sr-Latn", {day: "numeric", month: "long"})} u ${t}`;
  $("dlg").showModal(); $("name").focus();
}

$("cancel").onclick = () => $("dlg").close();
$("confirm").onclick = async () => {
  const name = $("name").value.trim(), email = $("email").value.trim();
  if (!name || !/^\S+@\S+\.\S+$/.test(email)) { $("dlgMsg").textContent = "Unesi ime i ispravan email."; $("dlgMsg").className = "msg err"; return; }
  $("confirm").disabled = true;
  const res = await saveBooking(pendingSlot, name, email);
  $("confirm").disabled = false;
  if (res === "ok") {
    $("dlg").close(); $("name").value = ""; $("email").value = "";
setStatus(`Zahtev je poslat za ${pendingSlot.replace("T", " u ")}. Čeka odobrenje.`);    await loadTaken(); selectDay(selectedDay);
  } else if (res === "taken") {
    $("dlg").close(); setStatus("Taj termin je upravo zauzet. Izaberi drugi.", true);
    await loadTaken(); selectDay(selectedDay);
  } else { $("dlgMsg").textContent = "Zakazivanje nije uspelo. Pokušaj ponovo."; $("dlgMsg").className = "msg err"; }
};

(async () => {
  $("title").textContent = CONFIG.title; $("sub").textContent = CONFIG.subtitle;
  if (!useDb) $("demo").hidden = false;
  await loadTaken(); buildDays();
})();
</script>
</body>
</html>
