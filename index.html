<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zakazivanje termina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap">
<style>
:root{--bg:#f3f6f8;--card:#fff;--ink:#14232b;--muted:#5d6e77;--line:#d3dde2;--accent:#0f7b6c;--accent-ink:#fff;--off:#e4eaed;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#0f1a20;--card:#17262e;--ink:#e8f0f3;--muted:#9bb0ba;--line:#2a3d47;--accent:#3fc2ad;--accent-ink:#06211c;--off:#1d2f38;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
.top{background:var(--card);border-bottom:1px solid var(--line);padding:14px 16px;text-align:center}
.top img{display:block;margin:0 auto;max-height:72px;max-width:70%;height:auto}
h1{font-size:1.75rem;font-weight:800;margin:8px 0 4px;letter-spacing:-.02em;text-align:center}
.sub{color:var(--muted);margin:0 0 20px;text-align:center}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:16px}
.day{flex:0 0 auto;min-width:64px;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:inherit;text-align:center;cursor:pointer}
.day b{display:block;font-size:1.15rem}
.day small{color:var(--muted)}
.day[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day[aria-pressed=true] small{color:inherit}
h2{font-size:1rem;margin:0 0 10px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.slot{padding:10px 0;border:1px solid var(--accent);background:transparent;color:var(--accent);border-radius:8px;font:600 1rem/1 inherit;cursor:pointer}
.slot:hover{background:var(--accent);color:var(--accent-ink)}
.slot:disabled{border-color:var(--off);background:var(--off);color:var(--muted);text-decoration:line-through;cursor:not-allowed}
.empty{color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);padding:20px;width:min(92vw,380px)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;font-weight:600;margin:12px 0 4px}
input{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.hint{font-size:.85rem;color:var(--muted);margin:4px 0 0}
fieldset{border:0;padding:0;margin:12px 0 0}
legend{font-weight:600;padding:0;margin-bottom:4px}
.opt{display:flex;gap:8px;align-items:center;font-weight:400;margin:6px 0}
.opt input{width:auto}
.row{display:flex;gap:8px;margin-top:18px}
.btn{flex:1;padding:11px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);font:600 1rem inherit;cursor:pointer}
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.msg{min-height:1.4em;margin-top:12px;font-weight:600}
.msg.err{color:var(--err)}
.msg.ok{color:var(--accent)}
.wa{display:inline-block;margin-top:8px;padding:11px 16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:700}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><img src="Logo.png" alt="Logo" onerror="this.parentElement.style.display='none'"></header>
<main>
  <h1 id="title"></h1>
  <p class="sub" id="sub"></p>
  <div class="days" id="days" role="group" aria-label="Izaberi dan"></div>
  <h2 id="dayLabel"></h2>
  <div class="slots" id="slots"></div>
  <div class="msg" id="status" role="status"></div>
</main>

<dialog id="dlg">
  <h2 id="dlgTitle">Zahtev za termin</h2>
  <label for="name">Ime i prezime</label>
  <input id="name" autocomplete="name">
  <label for="phone">Broj telefona (WhatsApp)</label>
  <input id="phone" type="tel" autocomplete="tel" placeholder="npr. 069 123 456">
  <p class="hint">Na ovaj broj ćeš dobiti potvrdu.</p>
  <fieldset id="items"><legend>Izaberi stavku</legend></fieldset>
  <p class="msg" id="dlgMsg" role="alert"></p>
  <div class="row">
    <button class="btn" id="cancel" type="button">Otkaži</button>
    <button class="btn main" id="confirm" type="button">Pošalji zahtev</button>
  </div>
</dialog>

<script>
/* ===== PODEŠAVANJA ===== */
const CONFIG = {
  title: "Zakaži termin",
  subtitle: "Izaberi dan i vreme. Termin važi kad ga potvrdimo na WhatsApp-u.",
  daysAhead: 14,
  startHour: 9,
  endHour: 17,
  slotMinutes: 30,
  skipWeekends: true,
  whatsappNumber: "38268000000",   // broj admina, međunarodni format bez + (068 000 000 -> 38268000000)
  defaultCountry: "382",            // pozivni broj države za brojeve koji počinju nulom
  items: ["stavkajedan", "stavkadva", "stavkatri", "stavkacetiri"],   // stavke koje klijent bira (menjaj nazive ovde)
  // Nazivi dana: redosled je uvek nedelja, ponedeljak, utorak, sreda, četvrtak, petak, subota
  dayNames: ["Nedelja", "Ponedeljak", "Utorak", "Sreda", "Četvrtak", "Petak", "Subota"],   // puni nazivi (iznad termina)
  dayShort: ["ned", "pon", "uto", "sre", "čet", "pet", "sub"],                              // kratki nazivi (na dugmadima)
  supabaseUrl: "https://pxdyohegxvqhhawnbuju.supabase.co",
  supabaseKey: "sb_publishable_7iN6lWxS5srh_rRnoaahkg_tI5c2zaB"
};

const $ = id => document.getElementById(id);
const hdr = {apikey: CONFIG.supabaseKey, "Content-Type": "application/json"};
if (CONFIG.supabaseKey.startsWith("eyJ")) hdr.Authorization = "Bearer " + CONFIG.supabaseKey;
const pad = n => String(n).padStart(2, "0");
const dateKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let taken = new Set(), selectedDay = null, pendingSlot = null;

function normPhone(raw) {
  let p = raw.replace(/[^\d+]/g, "");
  if (p.startsWith("+")) p = p.slice(1);
  else if (p.startsWith("00")) p = p.slice(2);
  else if (p.startsWith("0")) p = CONFIG.defaultCountry + p.slice(1);
  return /^\d{8,15}$/.test(p) ? p : null;
}
const niceSlot = k => { const [d, t] = k.split("T"), [y, m, dd] = d.split("-"); return `${dd}.${m}.${y}. u ${t}`; };

async function loadTaken() {
  try {
    const r = await fetch(CONFIG.supabaseUrl + "/rest/v1/taken_slots?select=slot", {headers: hdr});
    if (!r.ok) throw new Error();
    taken = new Set((await r.json()).map(x => x.slot));
  } catch (e) { setStatus("Ne mogu da učitam termine. Osveži stranicu.", true); }
}

async function saveBooking(slot, name, phone, item) {
  const r = await fetch(CONFIG.supabaseUrl + "/rest/v1/bookings", {method: "POST", headers: hdr, body: JSON.stringify({slot, name, phone, item})});
  if (r.status === 409) return "taken";
  if (r.ok) return "ok";
  try { const j = await r.json(); console.error("Supabase greška:", r.status, j); return "error:" + (j.message || j.code || r.status); }
  catch (e) { return "error:" + r.status; }
}

function setStatus(t, err) { const s = $("status"); s.textContent = t; s.className = "msg " + (err ? "err" : "ok"); }

function buildDays() {
  const wrap = $("days"); wrap.innerHTML = "";
  const d = new Date(); d.setHours(0,0,0,0);
  let added = 0, i = 0;
  while (added < CONFIG.daysAhead && i < 60) {
    const day = new Date(d); day.setDate(d.getDate() + i++);
    const wd = day.getDay();
    if (CONFIG.skipWeekends && (wd === 0 || wd === 6)) continue;
    const b = document.createElement("button");
    b.className = "day"; b.dataset.key = dateKey(day);
    b.innerHTML = `<small>${CONFIG.dayShort[day.getDay()]}</small><b>${day.getDate()}</b><small>${day.toLocaleDateString("sr-Latn", {month: "short"})}</small>`;
    b.onclick = () => selectDay(day);
    wrap.appendChild(b); added++;
    if (!selectedDay) selectedDay = day;
  }
  selectDay(selectedDay);
}

function selectDay(day) {
  selectedDay = day;
  document.querySelectorAll(".day").forEach(b => b.setAttribute("aria-pressed", b.dataset.key === dateKey(day)));
  $("dayLabel").textContent = `${CONFIG.dayNames[day.getDay()]}, ${day.toLocaleDateString("sr-Latn", {day: "numeric", month: "long"})}`;
  const box = $("slots"); box.innerHTML = "";
  const now = new Date();
  for (let m = CONFIG.startHour * 60; m + CONFIG.slotMinutes <= CONFIG.endHour * 60; m += CONFIG.slotMinutes) {
    const t = `${pad(Math.floor(m/60))}:${pad(m%60)}`;
    const key = `${dateKey(day)}T${t}`;
    const b = document.createElement("button");
    b.className = "slot"; b.textContent = t;
    b.disabled = taken.has(key) || new Date(`${key}:00`) < now;
    b.onclick = () => openDialog(key, t);
    box.appendChild(b);
  }
}

function openDialog(key, t) {
  pendingSlot = key; $("dlgMsg").textContent = "";
  $("dlgTitle").textContent = `Termin: ${selectedDay.toLocaleDateString("sr-Latn", {day: "numeric", month: "long"})} u ${t}`;
  $("dlg").showModal(); $("name").focus();
}

$("cancel").onclick = () => $("dlg").close();
$("confirm").onclick = async () => {
  const name = $("name").value.trim(), phone = normPhone($("phone").value);
  const item = (document.querySelector("input[name=item]:checked") || {}).value;
  if (name.length < 2 || !phone || !item) { $("dlgMsg").textContent = "Unesi ime, ispravan broj telefona i izaberi stavku."; $("dlgMsg").className = "msg err"; return; }
  $("confirm").disabled = true;
  const res = await saveBooking(pendingSlot, name, phone, item);
  $("confirm").disabled = false;
  if (res === "ok") {
    $("dlg").close(); $("name").value = ""; $("phone").value = "";
    const text = `Zdravo, želim da potvrdim termin: ${niceSlot(pendingSlot)}. Stavka: ${item}. Ime: ${name}`;
    const url = `https://wa.me/${CONFIG.whatsappNumber}?text=${encodeURIComponent(text)}`;
    const s = $("status");
    s.className = "msg ok";
    s.innerHTML = `Termin ${niceSlot(pendingSlot)} je rezervisan i čeka potvrdu. Pošalji poruku na WhatsApp da bismo ga potvrdili:<br><a class="wa" href="${url}" target="_blank" rel="noopener">Pošalji na WhatsApp</a>`;
    await loadTaken(); selectDay(selectedDay);
    window.location.href = url;
  } else if (res === "taken") {
    $("dlg").close(); setStatus("Taj termin je upravo zauzet. Izaberi drugi.", true);
    await loadTaken(); selectDay(selectedDay);
  } else { $("dlgMsg").textContent = "Zakazivanje nije uspelo (" + String(res).replace("error:", "") + ")."; $("dlgMsg").className = "msg err"; }
};

(async () => {
  $("title").textContent = CONFIG.title; $("sub").textContent = CONFIG.subtitle;
  $("items").insertAdjacentHTML("beforeend", CONFIG.items.map((v, i) =>
    `<label class="opt"><input type="radio" name="item" value="${v}"${i === 0 ? " checked" : ""}>${v}</label>`).join(""));
  await loadTaken(); buildDays();
})();
</script>
</body>
</html>
